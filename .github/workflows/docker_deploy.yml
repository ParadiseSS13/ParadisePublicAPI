name: Build and Push Docker Image

on:
  push:
    branches:
      - master

env:
  REGISTRY: docker-public.paradisestation.org

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate timestamp and commit SHA
        id: vars
        run: |
          BUILD_TAG="$(date -u +'%Y%m%d.%H%M%S')-$(git rev-parse --short HEAD)"
          echo "build_tag=${BUILD_TAG}" >> $GITHUB_OUTPUT

      - name: Log in to Nexus Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Publish Container to Nexus
        run: |
          dotnet publish ParadisePublicAPI.csproj \
            -c Release \
            /t:PublishContainer \
            -p:ContainerImageTags='"${{ steps.vars.outputs.build_tag }};latest"'